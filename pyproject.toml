[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gemma-harness"
version = "0.1.0"
description = "Gemma 4 agents that never fail silently: labelled recovery for tool calls."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = ["google-genai>=2.33.0", "pyyaml>=6"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools]
packages = ["gemma_harness"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
