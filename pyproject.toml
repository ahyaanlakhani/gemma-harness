[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "gemma-harness"
version = "0.2.0"
description = "Bounded recovery for Gemma tool loops, with explicit terminal outcomes and JSONL traces."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{ name = "Sabih's team" }]
keywords = ["gemma", "gemini", "agents", "function-calling", "tool-use"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
]
dependencies = ["google-genai>=2.33.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["gemma_harness*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
